<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ica12.css">
</head>
<body>
    <div class="app">
        <header>Random Christmas Trivia</header>
        <section class="quotes">
          <div class="quote-text" id="js-quote-text"></div>
          <div class="quote-text" id="js-answer-text"></div>
        </section>
        <section class="controls" >
          <button type="button" id="js-new-quote" class="new-quote button">
            Generate a new bit of trivia!
          </button>
          <button type="button" id="js-tweet" class="twitter button">
            Show me the answer!
          </button>
          <!-- <a class="answer button" id="js-tweet" target="_blank" rel="noreferrer">Show me the answer!</a> -->
        </section>
      </div>
      <script> 
        let answerStuff;
        const newBtn = document.querySelector("#js-new-quote").addEventListener('click', getQuote);
        const answerBtn = document.querySelector("#js-tweet").addEventListener('click', showAnswer);
        const endpoint = "https://trivia.cyberwisp.com/getrandomchristmasquestion";

        async function getQuote(){
            console.log("This worked!");

            try {
                const response = await fetch(endpoint);
                if(!response.ok){
                    throw Error(response.statusText)
                }
                answerStuff = await response.json();
                console.log(answerStuff);
                displayQuote(answerStuff['question']);
                document.querySelector("#js-answer-text").textContent = "";
            } catch (err){
                console.log(err);
                alert('Failed to fetch new quote');
            }
        }
        function showAnswer(){
          if(!answerStuff) return;
          document.querySelector("#js-answer-text").textContent = answerStuff['answer'];
        }

        function displayQuote(quote){
            const quoteText = document.querySelector("#js-quote-text");
            quoteText.textContent = quote;
        }

        getQuote();


      </script>
</body>
</html>
